<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Rafael Ferreira Martins | Tecnólogo em Análise e Desenvolvimento de Sistemas</title>
    <script>
      // Apply dark mode immediately to prevent flash of light mode
      (function() {
        const storedTheme = localStorage.getItem('theme');
        if (!storedTheme || storedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        }
        // Set initial language - default to 'pt' if not set
        let storedLang = localStorage.getItem('language');
        if (!storedLang) {
          storedLang = 'pt';
          localStorage.setItem('language', 'pt');
        }
        const langMap = {
          'pt': 'pt-BR',
          'en': 'en',
          'es': 'es-ES'
        };
        document.documentElement.lang = langMap[storedLang] || 'pt-BR';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
